name: CI

"on":
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Run tests
        run: uv run pytest tests/ -q --tb=short

      - name: Verify launch script syntax (Linux)
        if: runner.os == 'Linux'
        run: bash -n launch.sh && echo "launch.sh syntax ok"

      - name: Verify agent imports on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: uv run python -c "import local_browser_agent.app; print('agent importable on Windows')"

  build-mac:
    name: Build Mac .app
    runs-on: macos-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches pyproject version
        shell: bash
        run: |
          py=$(command -v python3 || command -v python)
          "$py" -c "import sys,tomllib; v=tomllib.load(open('pyproject.toml','rb'))['project']['version']; t='${{ github.ref_name }}'.removeprefix('v'); print('tag',t,'pyproject',v); sys.exit(0 if v==t else 1)"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Build macOS .app
        run: uv run pyinstaller local-browser-agent.spec

      - name: Ad-hoc codesign
        run: codesign --force --deep -s - dist/local-browser-agent.app

      - name: Smoke test frozen app (--smoke)
        run: |
          # --smoke imports everything and checks bundled templates/static/browser_use prompt
          # files, then exits without starting a server or a browser. The windowed build has no
          # console, so print the report it leaves in the user data dir.
          set +e
          dist/local-browser-agent.app/Contents/MacOS/local-browser-agent --smoke
          code=$?
          cat "$HOME/Library/Application Support/local-browser-agent/smoke.log" 2>/dev/null
          exit $code

      - name: Smoke test frozen app startup
        run: |
          # Start the server and poll GET /healthz until it answers 200 (20 s limit), instead
          # of only checking that --smoke imports work.
          dist/local-browser-agent.app/Contents/MacOS/local-browser-agent --no-browser --port 8765 &
          pid=$!
          ok=0
          for i in $(seq 1 20); do
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            if curl -fsS -o /dev/null --max-time 2 http://127.0.0.1:8765/healthz; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" -ne 1 ]; then
            if kill -0 "$pid" 2>/dev/null; then echo "app did not answer GET /healthz with 200 within 20 s"; else echo "app exited on startup"; fi
            kill "$pid" 2>/dev/null || true
            exit 1
          fi
          echo "app answered /healthz (pid $pid)"
          kill "$pid" 2>/dev/null || true

      - name: Zip artifact
        run: cd dist && zip -r ../local-browser-agent-mac.zip local-browser-agent.app

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: local-browser-agent-mac
          path: local-browser-agent-mac.zip

  build-windows:
    name: Build Windows .exe
    runs-on: windows-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches pyproject version
        shell: bash
        run: |
          py=$(command -v python3 || command -v python)
          "$py" -c "import sys,tomllib; v=tomllib.load(open('pyproject.toml','rb'))['project']['version']; t='${{ github.ref_name }}'.removeprefix('v'); print('tag',t,'pyproject',v); sys.exit(0 if v==t else 1)"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Build Windows .exe
        run: uv run pyinstaller local-browser-agent-windows.spec

      - name: Zip artifact
        shell: pwsh
        run: Compress-Archive -Path dist\local-browser-agent -DestinationPath local-browser-agent-windows.zip

      - name: Smoke test frozen exe (--smoke)
        shell: pwsh
        run: |
          # --smoke imports everything and checks bundled templates/static/browser_use prompt
          # files, then exits without starting a server or a browser.
          $p = Start-Process -FilePath "dist\local-browser-agent\local-browser-agent.exe" -ArgumentList "--smoke" -Wait -PassThru
          Get-ChildItem -Path $env:LOCALAPPDATA -Recurse -Filter smoke.log -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName }
          if ($p.ExitCode -ne 0) {
            Write-Error "frozen exe --smoke failed with exit code $($p.ExitCode)"
            exit 1
          }

      - name: Smoke test frozen exe startup
        shell: pwsh
        run: |
          # Start the server and poll GET /healthz until it answers 200 (20 s limit), instead
          # of only checking that the process survived a few seconds.
          $proc = Start-Process -FilePath "dist\local-browser-agent\local-browser-agent.exe" -ArgumentList "--no-browser","--port","8765" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 20; $i++) {
            if ($proc.HasExited) { break }
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:8765/healthz" -UseBasicParsing -TimeoutSec 2
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
            Start-Sleep -Seconds 1
          }
          if (-not $ok) {
            if ($proc.HasExited) { Write-Error "exe exited on startup with code $($proc.ExitCode)" }
            else { Write-Error "exe did not answer GET /healthz with 200 within 20 s" }
            $proc | Stop-Process -Force -ErrorAction SilentlyContinue
            exit 1
          }
          Write-Host "exe answered /healthz (pid $($proc.Id))"
          $proc | Stop-Process -Force -ErrorAction SilentlyContinue

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: local-browser-agent-windows
          path: local-browser-agent-windows.zip

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-mac, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/local-browser-agent-mac.zip
            release-assets/local-browser-agent-windows.zip
